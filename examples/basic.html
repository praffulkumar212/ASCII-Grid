<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ascii-engine — Phase 1 test</title>
  <style>
    :root {
      --ascii-fg: #1a1a1a;
      --ascii-bg: transparent;
      --ascii-accent: #4f8cff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ascii-fg: #e8e8e8; }
      body  { background: #111; color: #e8e8e8; }
    }
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h2   { font-size: 1rem; font-weight: 600; margin: 2rem 0 0.5rem; }
    .art-wrap { position: relative; border: 1px solid #ccc; padding: 1rem; }
    label { display: block; margin: 0.5rem 0 0.25rem; font-size: 0.85rem; }
    input[type=range] { width: 100%; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.5rem; margin: 1rem 0; }
    select, button { padding: 0.25rem 0.5rem; }
    button { cursor: pointer; }
    #status { font-size: 0.8rem; color: #888; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1 style="font-size:1.4rem;margin:0 0 0.25rem">ascii-engine Phase 1 test</h1>
  <p style="font-size:0.85rem;color:#888;margin:0 0 1.5rem">
    Drop an image below, or use the placeholder URL to test with a network image.
  </p>

  <!-- ── Controls ───────────────────────────────────────────────────────── -->
  <div class="controls">
    <div>
      <label>Image URL</label>
      <input id="imgUrl" type="text" style="width:100%;box-sizing:border-box"
        value="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/280px-PNG_transparency_demonstration_1.png">
    </div>
    <div>
      <label>Or drop / pick a file</label>
      <input id="imgFile" type="file" accept="image/*">
    </div>
    <div>
      <label>Charset</label>
      <select id="charset">
        <option value="classic" selected>Classic 10-level</option>
        <option value="extended">Extended 70-char</option>
        <option value="blocks">Unicode blocks</option>
        <option value="braille">Braille</option>
      </select>
    </div>
    <div>
      <label>Render mode</label>
      <select id="renderMode">
        <option value="dom" selected>DOM (spans)</option>
        <option value="pre">Pre (text)</option>
      </select>
    </div>
    <div>
      <label>Density <span id="densityVal">62</span>%</label>
      <input id="density" type="range" min="0" max="100" value="62">
    </div>
    <div>
      <label>Contrast <span id="contrastVal">50</span>%</label>
      <input id="contrast" type="range" min="0" max="100" value="50">
    </div>
    <div>
      <label>Gamma <span id="gammaVal">1.0</span></label>
      <input id="gamma" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
    </div>
    <div style="align-self:end">
      <button id="renderBtn">Render</button>
      <button id="clearCacheBtn" style="margin-left:0.5rem">Clear cache</button>
    </div>
  </div>

  <div id="status">Ready.</div>

  <!-- ── Art output (declarative engine mount) ──────────────────────────── -->
  <h2>Output</h2>
  <div class="art-wrap">
    <div id="art"></div>
  </div>

  <!-- ── Engine ─────────────────────────────────────────────────────────── -->
  <script src="../src/ascii-engine.js"></script>
  <script>
    const artEl = document.getElementById('art');
    let engine  = null;
    let imgSrc  = '';

    function status(msg) { document.getElementById('status').textContent = msg; }

    function getOpts() {
      return {
        charset:    document.getElementById('charset').value,
        renderMode: document.getElementById('renderMode').value,
        density:    Number(document.getElementById('density').value),
        contrast:   Number(document.getElementById('contrast').value),
        gamma:      Number(document.getElementById('gamma').value),
        fitMode:    'width',
        alt:        'ASCII art render of the uploaded image',
      };
    }

    async function doRender(src) {
      if (!src) { status('No image source.'); return; }
      const opts = { ...getOpts(), src };
      status('Rendering…');
      const t0 = performance.now();
      try {
        if (!engine) {
          engine = new ASCIIEngine(artEl, opts);
          await engine.render(src);
        } else {
          await engine.update(opts);
        }
        const g = engine._grid;
        status('Done in ' + (performance.now() - t0).toFixed(0) + ' ms  |  ' +
          'grid ' + (g ? g.cols + '×' + g.rows : '?') + '  |  ' +
          'cache ' + ASCIIEngine.cacheSize + ' entries');
        imgSrc = src;
      } catch (err) {
        status('Error: ' + err.message);
        console.error(err);
      }
    }

    // Wire up controls
    document.getElementById('renderBtn').addEventListener('click', () => {
      const fileInput = document.getElementById('imgFile');
      if (fileInput.files.length) {
        const url = URL.createObjectURL(fileInput.files[0]);
        doRender(url);
      } else {
        doRender(document.getElementById('imgUrl').value.trim());
      }
    });

    // Auto-render when a file is picked
    document.getElementById('imgFile').addEventListener('change', (e) => {
      if (e.target.files.length) {
        const url = URL.createObjectURL(e.target.files[0]);
        doRender(url);
      }
    });

    document.getElementById('clearCacheBtn').addEventListener('click', () => {
      ASCIIEngine.clearCache();
      status('Cache cleared.');
    });

    // Slider labels
    ['density','contrast'].forEach((id) => {
      document.getElementById(id).addEventListener('input', (e) =>
        document.getElementById(id + 'Val').textContent = e.target.value);
    });
    document.getElementById('gamma').addEventListener('input', (e) =>
      document.getElementById('gammaVal').textContent = Number(e.target.value).toFixed(1));

    // Charset / renderMode → re-render immediately if we have an image
    ['charset','renderMode'].forEach((id) => {
      document.getElementById(id).addEventListener('change', () => {
        if (engine && imgSrc) doRender(imgSrc);
      });
    });
  </script>
</body>
</html>
